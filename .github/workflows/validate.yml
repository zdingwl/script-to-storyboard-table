name: validate-storyboard-skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate canonical example
        run: python scripts/validate_storyboard.py examples/storyboard.example.json --strict

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
